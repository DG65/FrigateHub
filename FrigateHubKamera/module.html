<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        :root {
            --box: rgba(127, 135, 145, .16);
            --track: rgba(127, 135, 145, .25);
            --text: #ffffff;
            --textmuted: #9fb0c0;
            --accent: #2bb3c0;
            --alarm: #e5484d;
            --erkennung: #f5a524;
            --ok: #3fb950;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root.hell {
            --box: rgba(20, 30, 45, .06);
            --track: rgba(20, 30, 45, .12);
            --text: #1b2430;
            --textmuted: #5c6b7a;
        }

        html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
        body { font-family: var(--font); color: var(--text); }
        .wrap { box-sizing: border-box; height: 100%; padding: 46px 12px 10px; display: flex; flex-direction: column; gap: 8px; }

        /* Statuszeile */
        /* 8 px Abstand nach unten zum Vergrößern-Knopf von Symcon (oben rechts), damit er frei bleibt */
        .oben { display: flex; align-items: center; gap: 10px; min-height: 30px; margin-top: 8px; }
        .kopf { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 22px; flex: 1 1 auto; min-width: 0; }
        .rechts { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
        /* Stand des Livebilds und Archiv gut sichtbar oben rechts (Wunsch Dietmar 03.11.2026) */
        .zeit { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .zeit[hidden] { display: none; }
        .zeit .art { font-weight: 500; color: var(--textmuted); margin-right: 6px; }
        .archivknopf { border: none; background: var(--accent); color: #062b30; border-radius: 999px; padding: 6px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .archivknopf:hover { filter: brightness(1.1); }
        .archivknopf[hidden] { display: none; }
        .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--box); border-radius: 999px; padding: 2px 9px; font-size: 12px; white-space: nowrap; }
        .chip .punkt { width: 8px; height: 8px; border-radius: 50%; background: var(--textmuted); }
        .chip.ok .punkt { background: var(--ok); }
        .chip.aus .punkt { background: var(--alarm); }
        .chip.bewegung .punkt { background: var(--erkennung); animation: puls 1.2s ease-in-out infinite; }
        .chip.alarm { background: var(--alarm); color: #fff; font-weight: 700; animation: puls 1s ease-in-out infinite; }
        .chip.zahl { font-weight: 600; }
        .chip.warn { background: var(--erkennung); color: #1b1300; font-weight: 600; }
        @keyframes puls { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }

        /* Livebild */
        .bild { position: relative; flex: 1 1 auto; min-height: 90px; border-radius: 12px; overflow: hidden; background: #000; cursor: zoom-in; border: 2px solid transparent; transition: border-color .2s; }
        .bild.alarm { border-color: var(--alarm); box-shadow: 0 0 0 2px rgba(229, 72, 77, .35); animation: rahmen 1s ease-in-out infinite; }
        .bild.erkennung { border-color: var(--erkennung); }
        @keyframes rahmen { 0%, 100% { box-shadow: 0 0 0 2px rgba(229, 72, 77, .35); } 50% { box-shadow: 0 0 0 6px rgba(229, 72, 77, .15); } }
        .bild img, .bild video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
        .bild video { display: none; background: #000; }
        .bild.video video { display: block; }
        .bild.video img { visibility: hidden; }
        .ton { position: absolute; right: 8px; top: 6px; border: none; background: rgba(0, 0, 0, .45); color: #fff; border-radius: 6px; padding: 1px 7px; font-size: 13px; cursor: pointer; display: none; }
        .bild.video .ton { display: block; }
        .ton.ohne { opacity: .7; font-size: 11px; }
        .meldung { position: absolute; left: 8px; right: 8px; bottom: 6px; font-size: 11px; line-height: 1.35; color: #fff; background: rgba(0, 0, 0, .7); border-radius: 6px; padding: 4px 8px; }
        .bild.offline img { filter: grayscale(1) brightness(.5); }
        .hinweis { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; font-size: 13px; color: #d6dde4; pointer-events: none; }
        .knopf-neu { position: absolute; left: 8px; bottom: 6px; border: none; background: rgba(0, 0, 0, .45); color: #fff; border-radius: 6px; padding: 1px 7px; font-size: 13px; cursor: pointer; }

        /* Schalter */
        .schalter { display: flex; gap: 6px; flex-wrap: wrap; }
        .sw { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--track); background: none; color: var(--textmuted); border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
        .sw .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--track); }
        .sw.an { color: var(--text); border-color: var(--accent); }
        .sw.an .dot { background: var(--accent); }
        .sw.wartet { opacity: .5; pointer-events: none; }
        .sw[hidden] { display: none; }
        .sw.gesperrt { cursor: default; }
        .sw-titel { font-size: 11px; color: var(--textmuted); align-self: center; }

        /* Eigenständige Seite (IPSView/Browser): kein Symcon-Titel darüber, eigener Hintergrund */
        body.eigen { background: #15191e; }
        body.eigen .wrap { padding-top: 10px; }
        body.eigen .gross .leiste-oben { padding-top: 10px; }
        .name { font-weight: 600; font-size: 14px; margin-right: 4px; }
        :root.hell body.eigen { background: #f4f6f8; }

        /* Ereignisleiste */
        .leiste { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding-bottom: 2px; flex: 0 0 auto; scrollbar-width: thin; }
        .leiste:empty::before { content: 'Noch keine Ereignisse.'; color: var(--textmuted); font-size: 12px; }
        .karte { flex: 0 0 auto; width: 118px; background: var(--box); border-radius: 10px; overflow: hidden; cursor: pointer; border-top: 3px solid var(--erkennung); }
        .karte.alarm { border-top-color: var(--alarm); }
        .karte .vb { width: 100%; height: 66px; object-fit: cover; display: block; background: #111; }
        .karte .t { padding: 4px 7px 6px; font-size: 11px; line-height: 1.3; }
        .karte .t b { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .karte .t span { color: var(--textmuted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .karte { position: relative; }
        .karte.neu::after { content: ''; position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px rgba(0, 0, 0, .4); }
        .karte .ki { position: absolute; left: 5px; top: 5px; font-size: 11px; background: rgba(0, 0, 0, .55); color: #fff; border-radius: 6px; padding: 0 5px; }

        /* Großansicht */
        .gross { position: fixed; inset: 0; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column; z-index: 10; }
        .ablauf { max-height: 34%; overflow-y: auto; padding: 6px 12px 10px; color: #d6dde4; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 24px; }
        .ablauf .objekt { min-width: 220px; }
        .ablauf .name { font-weight: 600; margin: 4px 0 2px; }
        .ablauf button { display: flex; justify-content: space-between; gap: 16px; width: 100%; background: none; border: 0; border-left: 2px solid #4a5560; color: inherit; font: inherit; text-align: left; padding: 2px 0 2px 10px; cursor: pointer; }
        .ablauf button:hover { border-left-color: #5b8def; color: #fff; }
        .ablauf .uhr { opacity: .7; font-variant-numeric: tabular-nums; }
        .gross[hidden] { display: none; }
        /* oben 46px frei wie .wrap: dort zeichnet Symcon Kacheltitel und Vergrößern-Knopf */
        .gross .leiste-oben { display: flex; align-items: center; gap: 8px; padding: 46px 12px 10px; color: #fff; font-size: 13px; }
        .gross .leiste-oben .titel { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .gross button { border: 1px solid rgba(255, 255, 255, .35); background: none; color: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; cursor: pointer; }
        .gross button.aktiv { background: rgba(255, 255, 255, .18); }
        .gross .inhalt { flex: 1 1 auto; position: relative; }
        .gross img, .gross video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
        .gross .werkzeug, .gross .info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 12px 8px; color: #d6dde4; font-size: 12px; }
        .gross .werkzeug[hidden], .gross .info[hidden] { display: none; }
        .gross select, .gross input { background: rgba(255, 255, 255, .1); color: #fff; border: 1px solid rgba(255, 255, 255, .35); border-radius: 8px; padding: 3px 6px; font: inherit; font-size: 12px; }
        .gross select option { color: #000; }
        .gross .archiv { position: absolute; inset: 0; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 0 12px 12px; align-content: start; }
        .gross .archiv .karte { width: auto; color: #fff; background: rgba(255, 255, 255, .08); }
        .gross .archiv .karte .vb { position: static; width: 100%; height: 90px; }
        .gross .archiv .leer { color: #d6dde4; font-size: 13px; padding: 12px; }
        .gross .ptz { position: absolute; right: 12px; bottom: 12px; display: grid; grid-template-columns: repeat(3, 38px); gap: 4px; z-index: 2; }
        .gross .ptz button { padding: 4px 0; background: rgba(0, 0, 0, .55); touch-action: none; }
        .gross .ptz select { grid-column: 1 / 4; }

        @media (max-height: 260px) { .leiste { display: none; } }
        @media (max-height: 200px) { .schalter { display: none; } }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="oben">
            <div class="kopf" id="kopf"></div>
            <div class="rechts">
                <span class="zeit" id="zeit" title="Time of the live image" hidden></span>
                <button class="archivknopf" id="archiv" hidden>📅 Archive</button>
            </div>
        </div>
        <div class="bild" id="bild">
            <img id="live" alt="">
            <video id="video" autoplay muted playsinline></video>
            <button class="ton" id="ton" title="Sound">🔇</button>
            <div class="hinweis" id="hinweis">Loading …</div>
            <div class="meldung" id="meldung" hidden></div>
            <button class="knopf-neu" id="neu" title="Reload" hidden>↻</button>
        </div>
        <div class="schalter" id="schalter">
            <span class="sw-titel" id="swTitel" title="These switches change the setting in Frigate itself">Frigate:</span>
            <button class="sw" data-ident="Schalter_detect" data-key="detect"><span class="dot"></span>Detection</button>
            <button class="sw" data-ident="Schalter_recordings" data-key="recordings"><span class="dot"></span>Recording</button>
            <button class="sw" data-ident="Schalter_snapshots" data-key="snapshots"><span class="dot"></span>Snapshots</button>
            <button class="sw" id="rahmen" title="Draw boxes around detected objects in the live image (this view only)"><span class="dot"></span>Boxes</button>
        </div>
        <div class="leiste" id="leiste"></div>
    </div>

    <div class="gross" id="gross" hidden>
        <div class="leiste-oben">
            <button id="grossZurueck" hidden>◀ Archive</button>
            <span class="titel" id="grossTitel"></span>
            <button id="grossBild" hidden>Image</button>
            <button id="grossClip" hidden>▶ Clip</button>
            <button id="grossFav" hidden title="Keep permanently (Frigate will then not delete it)">☆</button>
            <button id="grossExport" hidden title="Save as an export in Frigate">💾</button>
            <button id="grossZu">✕</button>
        </div>
        <div class="info" id="grossInfo" hidden></div>
        <div class="werkzeug" id="grossWerkzeug" hidden></div>
        <div class="inhalt" id="grossInhalt"></div>
        <div class="ablauf" id="grossAblauf" hidden></div>
    </div>

    <script>
        // Hell/dunkel aus Symcons Kartenfarbe (html-sdk setzt --card-color/--content-color auf :root, SUITE.md
        // Stolperstein 30); prefers-color-scheme passt nicht zur Visualisierung. Rückfall: Geräteeinstellung.
        function helligkeit(wert) {
            var t = String(wert || '').trim();
            var rgb = t.match(/^rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/i);
            if (rgb) { return (0.299 * rgb[1] + 0.587 * rgb[2] + 0.114 * rgb[3]) / 255; }
            var h = t.replace(/^#/, '');
            if (!/^[0-9a-f]+$/i.test(h)) { return null; }
            if (h.length === 3) { h = h.replace(/(.)/g, '$1$1'); }
            // 8-stellig: führendes „ff" = AARRGGBB (Flutter-Farbe, deckend), sonst RRGGBBAA
            if (h.length === 8) { h = /^ff/i.test(h) ? h.slice(2) : h.slice(0, 6); }
            if (h.length !== 6) { return null; }
            var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }
        function farbschema() {
            var hell = null;
            try {
                var cs = getComputedStyle(document.documentElement);
                var karte = helligkeit(cs.getPropertyValue('--card-color'));
                var text = helligkeit(cs.getPropertyValue('--content-color'));
                if (karte !== null) { hell = karte >= 0.5; } else if (text !== null) { hell = text < 0.5; }
            } catch (e) { /* ohne Symcon-Variablen */ }
            if (hell === null && window.matchMedia) { hell = window.matchMedia('(prefers-color-scheme: light)').matches; }
            document.documentElement.classList.toggle('hell', !!hell);
        }
        farbschema();
        window.addEventListener('load', farbschema);
        setInterval(farbschema, 5000);
        var daten = null;          // letzter Stand aus PHP
        var rahmen = null;         // lokaler Schalter für die Erkennungsrahmen (null = Vorgabe aus PHP)
        var liveTimer = null;
        var liveLaeuft = false;
        var liveFehler = 0;
        var wartet = {};           // Schalter, deren Bestätigung durch Frigate noch aussteht
        var grossLive = false;
        var letzterSchnappschuss = null;
        var pc = null;             // WebRTC-Verbindung zu go2rtc (über den WebHook aufgebaut)
        var videoLaeuft = false;
        var uhrTimer = null;
        var videoVersuche = 0;
        var tonZustand = '';       // '' = unbekannt, 'ok', 'keineSpur', 'stille' (je Verbindung neu)
        var tonTimer = null;
        var meldungTimer = null;
        var videoTimer = null;
        var letzteMeldung = null;  // Zeitstempel der zuletzt gezeigten Rückmeldung aus PHP
        var archivStand = null;    // letzter Archiv-Abruf (Tag, Einträge, Filter)

        function el(id) { return document.getElementById(id); }

        /** Text in der Sprache der Visualisierung (Tabelle aus PHP: daten.texte), sonst der englische Quelltext. */
        function T(s, a) { var t = (daten && daten.texte && daten.texte[s]) || s; return a == null ? t : t.replace('%s', a); }
        function deutsch() { return T('language code: en') === 'de'; }

        /** Feste Texte des HTML-Gerüsts übersetzen; den Ladehinweis nur beim ersten Start (danach gehört er liveLaden). */
        function texteSetzen(erster) {
            document.documentElement.lang = deutsch() ? 'de' : 'en';
            var knopfText = function (id, text) { var b = el(id); b.lastChild.nodeValue = text; };
            if (erster) { el('hinweis').textContent = T('Loading …'); el('zeit').title = T('Time of the live image'); }
            el('archiv').textContent = T('📅 Archive');
            if (tonZustand === '') { el('ton').title = T('Sound'); }
            el('neu').title = T('Reload');
            el('swTitel').title = T('These switches change the setting in Frigate itself');
            document.querySelectorAll('.sw[data-key]').forEach(function (b) {
                b.lastChild.nodeValue = T({ detect: 'Detection', recordings: 'Recording', snapshots: 'Snapshots' }[b.dataset.key]);
            });
            knopfText('rahmen', T('Boxes'));
            el('rahmen').title = T('Draw boxes around detected objects in the live image (this view only)');
            el('grossZurueck').textContent = T('◀ Archive');
            el('grossBild').textContent = T('Image');
            el('grossFav').title = T('Keep permanently (Frigate will then not delete it)');
            el('grossExport').title = T('Save as an export in Frigate');
        }

        function url(param) {
            var q = 'k=' + encodeURIComponent(daten.k);
            for (var n in param) { q += '&' + n + '=' + encodeURIComponent(param[n]); }
            return daten.hook + '?' + q;
        }

        function hoehe(element, max) {
            var h = Math.round((element.clientHeight || 270) * (window.devicePixelRatio || 1));
            return Math.max(240, Math.min(max, Math.ceil(h / 120) * 120));
        }

        function rahmenAn() { return rahmen === null ? !!daten.rahmen : rahmen; }

        /* ---------------------------------------------------------------- Livebild */

        function liveLaden() {
            clearTimeout(liveTimer);
            if (!daten) { return; }
            if (!daten.api) {
                // Ohne Frigate-Adresse: letzter Schnappschuss aus dem Medienobjekt
                if (daten.schnappschuss) {
                    bildSetzen(url({ bild: 'schnappschuss', t: Date.now() }), daten.schnappschuss);
                } else {
                    hinweis(T('No image yet. Enter the Frigate address in the instance for the live image.'));
                }
                return;
            }
            if (document.hidden || !el('gross').hidden && !grossLive) { return; }
            if (videoLaeuft && !grossLive) { return; }
            if (liveLaeuft) { return; }
            liveLaeuft = true;
            var ziel = grossLive ? el('grossInhalt') : el('bild');
            var neu = new Image();
            neu.onload = function () {
                liveLaeuft = false;
                liveFehler = 0;
                if (grossLive) {
                    var img = el('grossInhalt').querySelector('img');
                    if (img) { img.src = neu.src; }
                } else {
                    el('live').src = neu.src;
                    hinweis('');
                    if (!videoLaeuft) { zeitZeigen('', new Date()); }
                }
                naechstes();
            };
            neu.onerror = function () {
                liveLaeuft = false;
                liveFehler++;
                if (!grossLive) { hinweis(daten.verfuegbar === false ? T('Frigate not reachable.') : T('Live image currently unavailable.')); }
                liveTimer = setTimeout(liveLaden, Math.min(30, 5 * liveFehler) * 1000);
            };
            neu.src = url({ bild: 'live', h: hoehe(ziel, 1080), rahmen: rahmenAn() ? 1 : 0, t: Date.now() });
        }

        function naechstes() {
            el('neu').hidden = daten.live > 0;
            // In der Großansicht läuft das Livebild auch bei „nur auf Tipp“ (alle 2 s).
            var takt = grossLive ? (daten.live || 2) : daten.live;
            if (takt > 0) { liveTimer = setTimeout(liveLaden, takt * 1000); }
        }

        function bildSetzen(quelle, text) {
            el('live').onload = function () { hinweis(''); };
            el('live').onerror = function () { hinweis(T('Image not available.')); };
            el('live').src = quelle;
            el('zeit').textContent = text || '';
            el('zeit').hidden = !text;
        }

        /** Datum und Uhrzeit oben rechts; art z. B. „Live" (läuft mit) oder leer (Stand des Standbilds). */
        function zeitZeigen(art, d) {
            var z = el('zeit');
            var zwei = function (n) { return ('0' + n).slice(-2); };
            z.textContent = '';
            if (art) { var a = document.createElement('span'); a.className = 'art'; a.textContent = T(art); z.appendChild(a); }
            // Deutsch TT.MM.JJJJ, sonst eindeutig JJJJ-MM-TT (wie die PHP-Seite über FrigateHubText::t('Y-m-d H:i:s'))
            var datum = deutsch() ? zwei(d.getDate()) + '.' + zwei(d.getMonth() + 1) + '.' + d.getFullYear()
                : d.getFullYear() + '-' + zwei(d.getMonth() + 1) + '-' + zwei(d.getDate());
            z.appendChild(document.createTextNode(datum + ' ' + zwei(d.getHours()) + ':' + zwei(d.getMinutes()) + ':' + zwei(d.getSeconds())));
            z.title = art ? T('Live video, current time') : T('Time of the live image');
            z.hidden = false;
        }

        function hinweis(text) {
            el('hinweis').textContent = text;
            el('hinweis').style.display = text ? 'flex' : 'none';
        }

        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) { videoStarten(); liveLaden(); } else { clearTimeout(liveTimer); videoStoppen(); }
        });

        /* ---------------------------------------------------------------- Livevideo (WebRTC) */

        function videoStarten() {
            if (!daten || !daten.video || pc || document.hidden || !window.RTCPeerConnection) { return; }
            if (videoVersuche >= 3) { return; }   // dreimal gescheitert: beim Standbild bleiben
            videoVersuche++;
            tonZuruecksetzen();
            var verbindung = new RTCPeerConnection({ bundlePolicy: 'max-bundle' });
            pc = verbindung;
            verbindung.addTransceiver('video', { direction: 'recvonly' });
            verbindung.addTransceiver('audio', { direction: 'recvonly' });
            verbindung.ontrack = function (ev) {
                var v = el('video');
                if (v.srcObject !== ev.streams[0]) { v.srcObject = ev.streams[0]; }
            };
            verbindung.onconnectionstatechange = function () {
                if (verbindung.connectionState === 'failed' || verbindung.connectionState === 'closed') { videoAufgeben(verbindung); }
            };
            // Kommt binnen 10 s kein Bild, gilt der Versuch als gescheitert (z. B. außerhalb des Heimnetzes)
            clearTimeout(videoTimer);
            videoTimer = setTimeout(function () { if (!videoLaeuft) { videoAufgeben(verbindung); } }, 10000);
            verbindung.createOffer().then(function (angebot) {
                return verbindung.setLocalDescription(angebot);
            }).then(function () {
                return iceFertig(verbindung);
            }).then(function () {
                return fetch(url({ webrtc: 1 }), { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: verbindung.localDescription.sdp });
            }).then(function (antwort) {
                if (!antwort.ok) { throw new Error('HTTP ' + antwort.status); }
                return antwort.text();
            }).then(function (sdp) {
                if (pc !== verbindung) { return; }
                return verbindung.setRemoteDescription({ type: 'answer', sdp: sdp });
            }).catch(function () { videoAufgeben(verbindung); });
        }

        /** Warten, bis der Browser seine Adressen gesammelt hat (höchstens 2 s): go2rtc bekommt sie im Angebot. */
        function iceFertig(verbindung) {
            return new Promise(function (fertig) {
                if (verbindung.iceGatheringState === 'complete') { fertig(); return; }
                var t = setTimeout(fertig, 2000);
                verbindung.addEventListener('icegatheringstatechange', function () {
                    if (verbindung.iceGatheringState === 'complete') { clearTimeout(t); fertig(); }
                });
            });
        }

        function videoAufgeben(verbindung) {

        /* ---------------------------------------------------------------- Ton prüfen */

        function tonText(art) {

        /** Empfangene Tonpakete der Verbindung, -1 wenn sich das nicht feststellen lässt. */
        function tonPakete(verbindung) {
            if (!verbindung || !verbindung.getStats) { return Promise.resolve(-1); }
            return verbindung.getStats().then(function (st) {
                var pakete = 0;
                st.forEach(function (s) { if (s.type === 'inbound-rtp' && s.kind === 'audio') { pakete += s.packetsReceived || 0; } });
                return pakete;
            }).catch(function () { return -1; });
        }

        /**
         * Nach dem Einschalten des Tons 4 s lang den Pegel lesen (der Browser misst ihn nur, solange nicht stumm).
         * Ein Mikrofon rauscht immer; ein Pegel, der unverändert unter -60 dB bleibt, ist digitale Stille.
         * Kennt der Browser keinen Pegel (audioLevel), bleibt es ohne Urteil.
         */
        function tonStillePruefen(verbindung) {
            var proben = [];
            var nullen = 0;            // direkt nach dem Einschalten meldet Chrome teils noch 0
            clearTimeout(tonTimer);
            (function messen() {
                tonTimer = setTimeout(function () {
                    if (pc !== verbindung || el('video').muted) { return; }
                    verbindung.getStats().then(function (st) {
                        var pegel = null;
                        st.forEach(function (s) { if (s.type === 'inbound-rtp' && s.kind === 'audio' && typeof s.audioLevel === 'number') { pegel = s.audioLevel; } });
                        if (pegel === null || pc !== verbindung) { return; }
                        if (pegel === 0 && proben.length === 0) {
                            if (++nullen >= 8) { tonOhne('stille'); } else { messen(); }
                            return;
                        }
                        proben.push(pegel);
                        var gleich = proben.every(function (p) { return Math.abs(p - proben[0]) < 0.00001; });
                        if (!gleich || proben[0] >= 0.001) { tonZustand = 'ok'; return; }
                        if (proben.length >= 8) { tonOhne('stille'); return; }
                        messen();
                    }).catch(function () { });
                }, 500);
            })();
        }

        /** Uhrzeit (Unix-Sekunden) → Stelle im Clip: Frigate hängt nur die aufgezeichneten Stücke aneinander. */
        function videoStelle(t, stuecke, clipStart) {
            if (!stuecke || !stuecke.length) { return Math.max(0, t - clipStart); }
            var stelle = 0;
            for (var i = 0; i < stuecke.length; i++) {
                if (t < stuecke[i][0]) { return stelle; }
                if (t <= stuecke[i][1]) { return stelle + (t - stuecke[i][0]); }
                stelle += stuecke[i][1] - stuecke[i][0];
            }
            return stelle;
        }

        /* ---------------------------------------------------------------- PTZ */

        /** Steuerkreuz in der Livegroßansicht, nur wenn Frigate PTZ-Fähigkeiten meldet und Bedienen erlaubt ist. */
        function ptzZeigen() {

            var pad = document.createElement('div');

            if (f.indexOf('zoom') >= 0) { knoepfe = knoepfe.concat([['−', 'ZOOM_OUT'], ['', ''], ['+', 'ZOOM_IN']]); }
            knoepfe.forEach(function (k) {

                var b = document.createElement('button');

                pad.appendChild(b);
            });
            if ((daten.ptz.presets || []).length) {
                var sel = document.createElement('select');
                var o0 = document.createElement('option');
                o0.textContent = T('Position …');
                o0.value = '';
                sel.appendChild(o0);
                daten.ptz.presets.forEach(function (p) { var o = document.createElement('option'); o.value = p; o.textContent = p; sel.appendChild(o); });
                sel.onchange = function () { if (sel.value) { requestAction('Kachel_PTZ', 'preset_' + sel.value); sel.value = ''; } };
                pad.appendChild(sel);
            }
            el('grossInhalt').appendChild(pad);
        }

        el('bild').onclick = function () {
            if (!daten) { return; }
            if (!daten.api) {
                if (daten.schnappschuss) { grossOeffnen(T('Last snapshot · %s', daten.schnappschuss)); grossBild(url({ bild: 'schnappschuss', t: Date.now() })); }
                return;
            }
            if (videoLaeuft) {
                grossOeffnen(T('Live video'));
                var v = document.createElement('video');
                v.autoplay = true;
                v.playsInline = true;
                v.controls = true;
                v.muted = el('video').muted;
                v.srcObject = el('video').srcObject;
                el('grossInhalt').appendChild(v);
                ptzZeigen();
                return;
            }
            grossOeffnen(T('Live image'));
            grossBild('');
            ptzZeigen();
            grossLive = true;
            clearTimeout(liveTimer);
            liveLaeuft = false;
            liveLaden();
        };

        el('grossZu').onclick = function () {
            el('gross').hidden = true;
            el('grossInhalt').textContent = '';
            grossLive = false;
            clearTimeout(liveTimer);
            liveLaeuft = false;
            liveLaden();
        };

        el('neu').onclick = function (ev) { ev.stopPropagation(); liveLaden(); };

        /* ---------------------------------------------------------------- Schalter */

        document.querySelectorAll('.sw[data-ident]').forEach(function (b) {
            b.onclick = function () {
                if (daten && daten.bedienung === false) { meldung(b.title); return; }
                var neu = !b.classList.contains('an');
                // Kein sofortiges Umfärben: Der Schalter folgt der Bestätigung von Frigate.
                wartet[b.dataset.ident] = neu;
                b.classList.add('wartet');
                setTimeout(function () { delete wartet[b.dataset.ident]; b.classList.remove('wartet'); }, 8000);
                requestAction(b.dataset.ident, neu);
            };
        });

        el('rahmen').onclick = function () {
            rahmen = !rahmenAn();
            el('rahmen').classList.toggle('an', rahmen);
            clearTimeout(liveTimer);
            liveLaeuft = false;
            liveLaden();
        };

        /* ---------------------------------------------------------------- Daten von Symcon */

        function handleMessage(nachricht) {
            var neu = typeof nachricht === 'string' ? JSON.parse(nachricht) : nachricht;
            if (!neu || !neu.hook) { return; }
            var ersterStart = daten === null;
            var taktGeaendert = daten && (daten.live !== neu.live || daten.api !== neu.api || daten.k !== neu.k || daten.video !== neu.video);
            daten = neu;
            texteSetzen(ersterStart);
            zeichnen();
            if (!daten.video) { videoStoppen(); }
            if (taktGeaendert) { videoStoppen(); videoVersuche = 0; }
            videoStarten();
            el('rahmen').hidden = !daten.api || videoLaeuft;
            if (ersterStart || taktGeaendert) {
                liveLaeuft = false;
                liveLaden();
            } else if (!daten.api && daten.schnappschuss !== letzterSchnappschuss) {
                liveLaden();
            }
            letzterSchnappschuss = daten.schnappschuss;
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --box: rgba(127, 135, 145, .16);
            --spur: rgba(127, 135, 145, .14);
            --aufnahme: rgba(150, 160, 172, .45);
            --text: #ffffff;
            --textmuted: #9fb0c0;
            --alarm: #e5484d;
            --erkennung: #3b8ae6;
            --akzent: #2bb3c0;
            --ok: #3fb950;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root.hell {
            --box: rgba(20, 30, 45, .06);
            --spur: rgba(20, 30, 45, .06);
            --aufnahme: rgba(80, 95, 110, .35);
            --text: #1b2430;
            --textmuted: #5c6b7a;
        }

        html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
        body { font-family: var(--font); color: var(--text); }
        /* oben 46px frei: dort zeichnet Symcon Kacheltitel und Vergrößern-Knopf */
        .wrap { box-sizing: border-box; height: 100%; padding: 46px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
        body.eigen { background: #15191e; }
        body.eigen .wrap { padding-top: 10px; }
        :root.hell body.eigen { background: #f4f6f8; }
        button { font: inherit; color: var(--text); background: var(--box); border: 0; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
        button.an { background: var(--akzent); color: #fff; }
        button[hidden] { display: none; }
        .kopf { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--textmuted); min-height: 22px; flex-wrap: wrap; }
        .kopf b { color: var(--text); font-size: 14px; }
        .kopf .luecke { flex: 1 1 auto; }
        .kopf .live { background: var(--alarm); color: #fff; }
        .kopf select { font: inherit; font-size: 12px; color: var(--text); background: var(--box); border: 0; border-radius: 999px; padding: 3px 8px; }
        .kopf select option { color: #000; }

        .haupt { flex: 0 1 auto; min-height: 80px; position: relative; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
        .haupt.voll { flex: 1 1 auto; }
        /* Spalten und Zeilenhöhe setzt rasterAnordnen() (Größe je Kamera 1–3 Felder, 0.27.0) */
        .raster { flex: 1 1 auto; display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); grid-auto-rows: 84px; align-content: start; overflow: auto; }
        .zelle { position: relative; border-radius: 10px; overflow: hidden; background: #000; cursor: zoom-in; border: 2px solid transparent; }
        .zelle.alarm { border-color: var(--alarm); }
        .zelle.offline img { filter: grayscale(1) brightness(.5); }
        .zelle img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .marken { position: absolute; left: 6px; bottom: 5px; right: 6px; display: flex; gap: 5px; align-items: center; flex-wrap: wrap; font-size: 11px; pointer-events: none; }
        .marken span { background: rgba(0, 0, 0, .55); color: #fff; border-radius: 6px; padding: 1px 6px; }
        .marken .rot { background: var(--alarm); font-weight: 700; }
        .marken .gelb { background: #f5a524; color: #1b1300; }
        .leer { color: var(--textmuted); font-size: 13px; padding: 8px; }
        .zelle.bearbeiten { cursor: grab; border-color: var(--akzent); border-style: dashed; }
        .zelle.zieht { opacity: .4; }
        .zelle.ziel { border-color: var(--text); border-style: solid; }
        .ordnen { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; gap: 4px; justify-content: space-between; z-index: 2; }
        .ordnen button { background: rgba(0, 0, 0, .65); color: #fff; font-size: 12px; padding: 2px 9px; }
        .ordnen .mitte { display: flex; gap: 4px; }
        .ordnen button.an { background: var(--akzent); }
        .ordnen select { font: inherit; font-size: 12px; background: rgba(0, 0, 0, .65); color: #fff; border: 0; border-radius: 999px; padding: 2px 6px; }
        .ordnen select option { color: #000; }
        .zelle.aus { opacity: .4; }
        .zelle.hotspot { cursor: zoom-in; }
        .zelle.imhotspot { border-color: var(--akzent); }
        .hotspotleer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; color: #fff; font-size: 13px; }
        .marken .stern { background: var(--akzent); }
        .kopf input { font: inherit; font-size: 12px; color: var(--text); background: var(--box); border: 0; border-radius: 999px; padding: 3px 10px; width: 9em; }
        .ordnen button:disabled { opacity: .35; cursor: default; }

        .wahl { display: flex; gap: 5px; flex-wrap: wrap; font-size: 12px; }
        .buehne { flex: 1 1 auto; position: relative; border-radius: 10px; overflow: hidden; background: #000; }
        .buehne img, .buehne video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
        .buehne .zeit { position: absolute; left: 8px; top: 8px; font-size: 12px; color: #fff; background: rgba(0, 0, 0, .55); border-radius: 6px; padding: 2px 8px; pointer-events: none; }
        .buehne .zeit.wg { background: rgba(43, 179, 192, .85); }
        .buehne .hinweis { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: #fff; pointer-events: none; }
        .buehne .hinweis span { background: rgba(0, 0, 0, .6); border-radius: 6px; padding: 3px 10px; }

        .zl { flex: 0 0 auto; display: flex; flex-direction: column; gap: 3px; font-size: 11px; user-select: none; -webkit-user-select: none; }
        .zlkopf { display: flex; align-items: center; gap: 4px; color: var(--textmuted); }
        .zlkopf .luecke { flex: 1 1 auto; }
        .zlkopf button { padding: 1px 8px; font-size: 11px; }
        .spuren { position: relative; touch-action: none; cursor: grab; }
        .spuren.zieht { cursor: grabbing; }
        .spurzeile { display: flex; align-items: center; height: 18px; margin: 2px 0; }
        .spurname { flex: 0 0 74px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--textmuted); padding-right: 6px; cursor: pointer; }
        .spurname.aktiv { color: var(--text); font-weight: 600; }
        .spur { position: relative; flex: 1 1 auto; height: 100%; background: var(--spur); border-radius: 4px; overflow: hidden; }
        .auf { position: absolute; top: 6px; bottom: 6px; background: var(--aufnahme); border-radius: 2px; pointer-events: none; }
        .ev { position: absolute; top: 2px; bottom: 2px; min-width: 3px; border-radius: 2px; background: var(--erkennung); }
        .ev.alarm { background: var(--alarm); }
        .ev.gesehen { opacity: .4; }
        .wegspur { position: absolute; top: 0; bottom: 0; min-width: 4px; box-sizing: border-box; border: 2px solid var(--akzent); border-radius: 3px; pointer-events: none; }
        .wegspur.an { background: rgba(43, 179, 192, .35); }
        .weg { position: absolute; left: 8px; right: 8px; top: 34px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; pointer-events: none; z-index: 2; }
        .weg button { pointer-events: auto; font-size: 11px; padding: 2px 8px; background: rgba(0, 0, 0, .6); color: #fff; }
        .weg button.an { background: var(--akzent); }
        .weg .pfeil { color: #fff; font-size: 11px; text-shadow: 0 0 3px #000; }
        .ev:not(.gesehen) { box-shadow: 0 0 0 1px var(--text) inset; }
        .kopfpunkt { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--akzent); pointer-events: none; }
        .kopfpunkt[hidden] { display: none; }
        .achse { position: relative; height: 13px; margin-left: 74px; color: var(--textmuted); }
        .achse span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
        .tipp { position: absolute; z-index: 5; pointer-events: none; background: rgba(0, 0, 0, .8); color: #fff; border-radius: 6px; padding: 2px 8px; font-size: 11px; white-space: nowrap; transform: translate(-50%, -100%); }
        .tipp[hidden] { display: none; }
        /* Zeitleiste rechts, senkrecht (0.30.0): neueste Zeit oben, je Kamera eine Spalte */
        .wrap.zlrechts { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); column-gap: 8px; }
        .wrap.zlrechts .kopf { grid-column: 1 / 3; }
        .wrap.zlrechts .haupt { grid-column: 1; grid-row: 2; min-height: 0; }
        .wrap.zlrechts .zl { grid-column: 2; grid-row: 2; display: grid; grid-template-columns: 38px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 4px; min-height: 0; }
        .wrap.zlrechts .zl[hidden] { display: none; }
        .wrap.zlrechts .zlkopf { grid-column: 1 / 3; flex-wrap: wrap; justify-content: flex-end; }
        .wrap.zlrechts .zlkopf .luecke { flex-basis: 100%; height: 0; }
        .wrap.zlrechts .achse { grid-column: 1; grid-row: 2; height: auto; margin: 22px 0 0; }
        .wrap.zlrechts .achse span { left: auto; right: 2px; transform: translateY(-50%); }
        .wrap.zlrechts .spuren { grid-column: 2; grid-row: 2; display: flex; gap: 4px; min-height: 0; }
        .wrap.zlrechts .spurzeile { flex: 1 1 0; flex-direction: column; height: auto; margin: 0; min-width: 0; }
        .wrap.zlrechts .spurname { flex: 0 0 18px; padding: 0 0 4px; text-align: center; width: 100%; }
        .wrap.zlrechts .spur { width: 100%; height: auto; flex: 1 1 auto; }
        .wrap.zlrechts .auf { top: auto; bottom: auto; left: 6px; right: 6px; }
        .wrap.zlrechts .ev { top: auto; bottom: auto; left: 2px; right: 2px; min-width: 0; min-height: 3px; }
        .wrap.zlrechts .wegspur { top: auto; bottom: auto; left: 0; right: 0; min-width: 0; min-height: 4px; }
        .wrap.zlrechts .kopfpunkt { left: 0; right: 0; width: auto; height: 2px; top: 0; bottom: auto; }
        .tipp.seitlich { transform: translate(-100%, -50%); }
        /* Ereignisliste aller Kameras (0.34.0) */
        .eliste { flex: 1 1 auto; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; align-content: start; }
        .ekarte { position: relative; background: var(--box); border-radius: 10px; overflow: hidden; cursor: pointer; border-top: 3px solid var(--erkennung); }
        .ekarte.alarm { border-top-color: var(--alarm); }
        .ekarte.neu::after { content: ''; position: absolute; right: 6px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--akzent); box-shadow: 0 0 0 2px rgba(0, 0, 0, .4); }
        .ekarte img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #111; }
        .ekarte .t { padding: 4px 8px 6px; font-size: 11px; line-height: 1.35; }
        .ekarte .t b { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ekarte .t span { display: block; color: var(--textmuted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        /* PTZ (0.26.0): Knöpfe oben rechts über dem Livebild, Steuerfläche über dem Bild */
        .buehne .ptzleiste { position: absolute; right: 8px; top: 8px; z-index: 3; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: flex-end; font-size: 12px; }
        .buehne .ptzleiste button { background: rgba(0, 0, 0, .6); color: #fff; touch-action: none; }
        .buehne .ptzleiste button.an { background: var(--akzent); }
        .buehne .ptzleiste select { font: inherit; background: rgba(0, 0, 0, .6); color: #fff; border: 0; border-radius: 999px; padding: 3px 8px; }
        .buehne .ptzleiste select option { color: #000; }
        .ptzflaeche { position: absolute; inset: 0; z-index: 2; cursor: crosshair; touch-action: none; }
        .ptzflaeche[hidden], .ptzrahmen[hidden] { display: none; }
        .ptzrahmen { position: absolute; border: 2px solid var(--akzent); background: rgba(43, 179, 192, .15); border-radius: 3px; pointer-events: none; }
        .ptzbereit video, .ptzbereit img { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; cursor: grab; }
        .ptzzieht, .ptzzieht video, .ptzzieht img { cursor: grabbing; }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="kopf" id="kopf"></div>
        <div class="haupt" id="haupt"></div>
        <div class="zl" id="zl">
            <div class="zlkopf">
                <span id="zlBereich"></span><span class="luecke"></span>
                <button data-spanne="86400">24 h</button><button data-spanne="21600">6 h</button><button data-spanne="3600">1 h</button><button data-spanne="600">10 min</button>
                <button id="zlJetzt">⏭</button>
            </div>
            <div class="spuren" id="spuren"></div>
            <div class="achse" id="achse"></div>
        </div>
    </div>
    <div class="tipp" id="tipp" hidden></div>

    <script>
        // Hell/dunkel aus Symcons Kartenfarbe (html-sdk setzt --card-color/--content-color auf :root, SUITE.md
        // Stolperstein 30); prefers-color-scheme passt nicht zur Visualisierung. Rückfall: Geräteeinstellung.
        function helligkeit(wert) {
            var t = String(wert || '').trim();
            var rgb = t.match(/^rgba?\(\s*(\d+)[\s,]+(\d+)[\s,]+(\d+)/i);
            if (rgb) { return (0.299 * rgb[1] + 0.587 * rgb[2] + 0.114 * rgb[3]) / 255; }
            var h = t.replace(/^#/, '');
            if (!/^[0-9a-f]+$/i.test(h)) { return null; }
            if (h.length === 3) { h = h.replace(/(.)/g, '$1$1'); }
            // 8-stellig: führendes „ff" = AARRGGBB (Flutter-Farbe, deckend), sonst RRGGBBAA
            if (h.length === 8) { h = /^ff/i.test(h) ? h.slice(2) : h.slice(0, 6); }
            if (h.length !== 6) { return null; }
            var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }
        function farbschema() {
            var hell = null;
            try {
                var cs = getComputedStyle(document.documentElement);
                var karte = helligkeit(cs.getPropertyValue('--card-color'));
                var text = helligkeit(cs.getPropertyValue('--content-color'));
                if (karte !== null) { hell = karte >= 0.5; } else if (text !== null) { hell = text < 0.5; }
            } catch (e) { /* ohne Symcon-Variablen */ }
            if (hell === null && window.matchMedia) { hell = window.matchMedia('(prefers-color-scheme: light)').matches; }
            document.documentElement.classList.toggle('hell', !!hell);
        }
        farbschema();
        window.addEventListener('load', farbschema);
        setInterval(farbschema, 5000);

        /* ================================================================ Zustand */
        var daten = null;
        var modus = 'uebersicht';      // 'uebersicht' | 'kamera'
        var aktiv = null;              // Kamera-ID in der Großansicht
        var wg = null;                 // Wiedergabe: {kamera, von, bis, ereignis}
        var auto = null;               // automatisch geöffnete Alarm-Ansicht: {kamera, timer}
        var alarmVorher = {};          // Alarmzustand je Kamera beim letzten Datenstand
        var letzte = {};               // zuletzt geladenes Rasterbild je Kamera
        var rasterTimer = null, liveTimer = null, kopfTimer = null, zlTimer = null;
        var pc = null;                 // WebRTC-Verbindung der Großansicht
        var ansicht = { bis: Date.now() / 1000, spanne: 86400, folgen: true };
        var zlDaten = {};              // je Kamera {von, bis, aufnahme, ereignisse, laedt}
        var listeFilter = 'alle';      // Ereignisliste: 'alle' | 'alarm' | 'neu'
        var ordnen = null;             // Anordnen-Modus: {reihenfolge: [...], groesse: {...}} (Entwurf bis „Fertig“)

        function el(id) { return document.getElementById(id); }
        function T(s, a) { var t = (daten && daten.texte && daten.texte[s]) || s; return a == null ? t : t.replace('%s', a); }
        function sprache() { return T('language code: en') === 'de' ? 'de-DE' : 'en-GB'; }
        function jetzt() { return Date.now() / 1000; }
        function kameraDaten(id) { return (daten && daten.kameras || []).filter(function (k) { return k.kamera === id; })[0] || null; }
        function zugangUrl(k, param) {
            var z = k && k.zugang;
            if (!z || !z.hook) { return null; }
            var u = z.hook + '?k=' + encodeURIComponent(z.k);
            Object.keys(param).forEach(function (n) { u += '&' + n + '=' + encodeURIComponent(param[n]); });
            return u;
        }
        function uhrzeit(t, mitDatum) {
            var d = new Date(t * 1000);
            var o = { hour: '2-digit', minute: '2-digit' };
            if (mitDatum) { o.day = '2-digit'; o.month = '2-digit'; }
            return d.toLocaleString(sprache(), o);
        }
        function uhrzeitSek(t) { return new Date(t * 1000).toLocaleTimeString(sprache(), { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }

        /* ================================================================ Kopf */
        function kopfZeichnen() {
            var kopf = el('kopf');
            // Nur bei Änderung neu bauen: sonst trifft ein Tipp womöglich einen gerade ersetzten Knopf
            var schluessel = JSON.stringify([daten.name, daten.eigen, daten.verfuegbar, daten.kameras.length,
                daten.kameras.filter(function (k) { return k.alarm; }).length, ungesehen(), ungesehenAlle(), !!wg, !!folge, modus, ordnen, sichtId, daten.layout, listeFilter, wg && [wg.kamera, wg.ereignis, wg.ausListe]]);
            if (kopf.dataset.schluessel === schluessel) { return; }
            kopf.dataset.schluessel = schluessel;
            kopf.textContent = '';
            if (daten.eigen && daten.name) {
                var b = document.createElement('b');
                b.textContent = daten.name;
                kopf.appendChild(b);
                document.title = daten.name;
            }
            var s = document.createElement('span');
            var alarme = daten.kameras.filter(function (k) { return k.alarm; }).length;
            s.textContent = daten.verfuegbar === false ? T('⛔ Frigate not reachable') : T(daten.kameras.length === 1 ? '%s camera' : '%s cameras', daten.kameras.length)
                + (alarme ? ' · 🚨 ' + T(alarme === 1 ? '%s alarm' : '%s alarms', alarme) : '')
                + (ungesehen() ? ' · ' + T('%s not seen yet', ungesehen()) : '');
            kopf.appendChild(s);
            var l = document.createElement('span');
            l.className = 'luecke';
            kopf.appendChild(l);
            if (ordnen) { ordnenKopf(kopf); return; }
            if (modus === 'uebersicht' && !wg && (daten.layout && daten.layout.ansichten || []).length > 1) {
                // Ansicht wählen (je Gerät gemerkt)
                var sw = document.createElement('select');
                sw.title = T('View');
                daten.layout.ansichten.forEach(function (a, i) { var op = document.createElement('option'); op.value = a.id; op.textContent = ansichtName(a, i); sw.appendChild(op); });
                sw.value = ansichtAktuell().id;
                sw.onchange = function () { benutzt(); sichtWaehlen(sw.value); };
                kopf.appendChild(sw);
            }
            if ((modus === 'uebersicht' || modus === 'ereignisse') && !wg && daten.api) {
                var ev = document.createElement('button');
                ev.textContent = T('🗂 Events');
                ev.title = T('All events of the cameras in this view as preview images');
                if (modus === 'ereignisse') { ev.className = 'an'; }
                ev.onclick = function () { benutzt(); if (modus === 'ereignisse') { uebersicht(); } else { ereignisseZeigen(); } };
                kopf.appendChild(ev);
            }
            if (modus === 'ereignisse') {
                var lf = document.createElement('select');
                [['alle', T('All')], ['alarm', T('Alerts only')], ['neu', T('Not seen yet')]].forEach(function (x) {
                    var op = document.createElement('option'); op.value = x[0]; op.textContent = x[1]; lf.appendChild(op);
                });
                lf.value = listeFilter;
                lf.onchange = function () { benutzt(); listeFilter = lf.value; ereignislisteFuellen(); };
                kopf.appendChild(lf);
            }
            if (wg && wg.ereignis) {
                [[T('◀'), T('Earlier event'), -1], [T('▶'), T('Later event'), 1]].forEach(function (x) {
                    var b = document.createElement('button');
                    b.textContent = x[0];
                    b.title = x[1];
                    b.disabled = !nachbarEreignis(x[2]);
                    b.onclick = function () { benutzt(); nachbarAbspielen(x[2]); };
                    kopf.appendChild(b);
                });
            }
            if (wg && wg.ausListe) {
                var zur = document.createElement('button');
                zur.textContent = T('🗂 Back to events');
                zur.onclick = function () { benutzt(); wiedergabeStoppen(); folge = null; ereignisseZeigen(); };
                kopf.appendChild(zur);
            }
            if (modus === 'uebersicht' && !wg && daten.api && typeof requestAction === 'function') {
                var o = document.createElement('button');
                o.textContent = T('⚙ Arrange');
                o.title = T('Change views, order and size of the cameras');
                o.onclick = function () { benutzt(); ordnenStarten(); };
                kopf.appendChild(o);
            }
            if (ungesehenAlle() && typeof requestAction === 'function') {
                var ok = document.createElement('button');
                ok.textContent = T('✓ All seen');
                ok.title = T('Mark all alerts and detections of the last 24 hours as seen — also in Frigate');
                ok.onclick = function () { benutzt(); alleGesehen(); };
                kopf.appendChild(ok);
            }
            if (wg && !folge) {
                var f = document.createElement('button');
                f.textContent = T('👣 Follow person');
                f.title = T('Follow the person you see here across all cameras');
                f.onclick = function () { benutzt(); folgeStarten(); };
                kopf.appendChild(f);
            }
            if (wg) {
                var live = document.createElement('button');
                live.className = 'live';
                live.textContent = T('● Live');
                live.title = T('Back to live');
                live.onclick = function () { benutzt(); wiedergabeEnde(); };
                kopf.appendChild(live);
            }
            if (modus === 'kamera') {
                var alle = document.createElement('button');
                alle.textContent = T('▦ All cameras');
                alle.onclick = function () { benutzt(); uebersicht(); };
                kopf.appendChild(alle);
            }
        }

        /* ================================================================ Gesehen (Abgleich mit Frigate) */
        // Ungesehene Alarme der letzten 24 h laut Frigate (Summe der Kameras)
        function ungesehen() {
            return (daten && daten.kameras || []).reduce(function (n, k) { return n + (Number(k.ungesehen) || 0); }, 0);
        }
        // Ein geöffnetes Ereignis gilt als gesehen — in Symcon und in Frigate
        function ungesehenAlle() {

        /* ================================================================ Person folgen (0.25.0) */

        // die Wiedergabe springt beim Verlassen einer Kamera zur nächsten.

        function ereignisFinden(kamera, id) {

        }
        function folgeStarten() {
            if (!wg || !daten.hook) { return; }
            var ev = wg.ereignis ? ereignisFinden(wg.kamera, wg.ereignis) : null;
            var s = Math.floor(ev ? ev.s : wgPosition()), e = Math.ceil(ev ? (ev.e || jetzt()) : wgPosition());
            var kamera = wg.kamera, anfrage = wg;
            hinweis(T('Looking for the person on the other cameras …'));
            fetch(daten.hook + '?k=' + encodeURIComponent(daten.k || '') + '&folgen=' + encodeURIComponent(kamera + '|' + s + '|' + e), { cache: 'no-store' })
                .then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
                    if (wg !== anfrage) { return; }
                    if (!j || !j.segmente || !j.segmente.length) { hinweis(T('No person found at this moment.')); return; }
                    folge = { segmente: j.segmente, i: j.start || 0, aussehen: !!j.aussehen };
                    wg.folge = true;
                    hinweis(j.segmente.length === 1 ? T('The person was not seen on any other camera.') : '');

        }
        function folgeAbspielen(i) {
            var vor = folge.i, seg = folge.segmente[i], davor = folge.segmente[i - 1];
            folge.i = i;

            // Weiter in Laufrichtung: war die Person kurz auf beiden Kameras, ab dem Wechsel weiterspielen

        // Reviews dieser Kamera, die der Abschnitt berührt, gelten beim Abspielen als gesehen

        /* ---------------------------------------------------------------- Anordnung (0.27.0–0.29.0) */
        // Ansichten (je mit Reihenfolge, Feldformat, Raster, ausgeblendeten Kameras, Hotspot-Feld) liegen in der
        // Server-Instanz; welche Ansicht ein Gerät zeigt, merkt sich das Gerät selbst.
        var RASTER = ['1x1', '2x1', '2x2', '3x2', '3x3', '4x2', '4x3', '4x4', '5x4', '5x5', '6x5', '6x6'];
        var FORMATE = ['1x1', '2x1', '1x2', '2x2', '3x2', '2x3', '3x3'];

        function ansichtName(a, i) { return a.name || T('View %s', i + 1); }
        function ansichtAktuell() {
            if (ordnen) { return ordnen.ansichten.filter(function (a) { return a.id === ordnen.sicht; })[0] || ordnen.ansichten[0]; }

        function format(key) {

        }
        /** Festes Raster der Ansicht: {spalten, zeilen} oder null (automatisch). */
        function festesRaster() {
            var m = /^([1-6])x([1-6])$/.exec(ansichtAktuell().raster || '');

        function hatHotspot() { return (ansichtAktuell().reihenfolge || []).indexOf('_hotspot') >= 0; }

        /** Felder der Ansicht in Reihenfolge (Unbekannte danach nach Name); ausgeblendete nur beim Anordnen. */
        function zellenListe() {
            var a = ansichtAktuell(), r = a.reihenfolge || [], aus = a.aus || [];
            var zellen = daten.kameras.slice();
            if (daten.birdseye) { zellen.push({ kamera: '', name: 'Birdseye', online: true }); }

            var pos = function (k) { var i = r.indexOf(k.hotspot ? '_hotspot' : schluessel(k)); return i < 0 ? (k.kamera === '' ? -1 : 1e6) : i; };

                .map(function (k, i) { return { k: k, i: i }; }).sort(function (x, y) {
                    return (pos(x.k) - pos(y.k)) || (x.k.kamera === '' ? -1 : y.k.kamera === '' ? 1 : x.k.name.localeCompare(y.k.name)) || (x.i - y.i);
                }).map(function (x) { return x.k; });

        /** Spalten aus der Breite (oder dem festen Raster), Zeilenhöhe 16:9 bzw. Kachelhöhe; Felder b × h. */
        function rasterAnordnen() {

            if (!raster) { return; }
            var breite = raster.clientWidth || 600, abstand = 6;
            var zellen = Array.prototype.slice.call(raster.querySelectorAll('.zelle'));
            // Automatisch: so viele Spalten, dass die Kameras die Breite füllen (höchstes Feld bestimmt die Zeilen)
            var maxB = 1, maxH = 1, flaeche = 0;
            zellen.forEach(function (z) { var b = Number(z.dataset.b) || 1, h = Number(z.dataset.h) || 1; maxB = Math.max(maxB, b); maxH = Math.max(maxH, h); flaeche += b * h; });

            if (fest) {

                z.style.gridRow = 'span ' + (Number(z.dataset.h) || 1);
            });
        }

        /* --- Anordnen-Modus: bearbeitet eine Kopie aller Ansichten, „Fertig“ speichert */
        function ordnenStarten() {

        /** Bearbeiten-Leiste einer Zelle: ◀ Format 👁 ▶ */

        /* --- Hotspot-Feld: zeigt die angetippte Kamera bzw. die mit dem letzten Alarm, Bild jede Sekunde */
        function hotspotWahl() {
            var liste = sichtKameras();
            if (!hotspotKamera || !liste.some(function (k) { return k.kamera === hotspotKamera; })) { hotspotKamera = liste.length ? liste[0].kamera : null; }
            return hotspotKamera;

            var k = kameraDaten(kamera);
            z.dataset.kamera = kamera;
            z.classList.toggle('alarm', !!(k && k.alarm));
            var img = z.querySelector('img');
            if (img && letzte[kamera]) { img.src = letzte[kamera]; }
            var m = z.querySelector('.marken');

            document.querySelectorAll('.zelle').forEach(function (x) { x.classList.toggle('imhotspot', !x.classList.contains('hotspot') && x.dataset.kamera === kamera); });
            hotspotLaden();

        function hotspotLaden() {
            clearTimeout(hotspotTimer);
            var z = document.querySelector('.zelle.hotspot');
            if (!z || ordnen || document.hidden || modus !== 'uebersicht' || !z.dataset.kamera) { return; }
            var kamera = z.dataset.kamera;
            var h = Math.max(360, Math.min(1080, Math.ceil((z.clientHeight || 360) * (window.devicePixelRatio || 1) / 120) * 120));
            var vor = new Image();
            vor.onload = function () { var img = z.querySelector('img'); if (img && z.dataset.kamera === kamera) { img.src = vor.src; } letzte[kamera] = vor.src; hotspotTimer = setTimeout(hotspotLaden, 1000); };
            vor.onerror = function () { hotspotTimer = setTimeout(hotspotLaden, 3000); };
            vor.src = serverBild(kamera, h);
        }

        function rasterZeichnen(haupt) {
            var raster = document.createElement('div');
            raster.className = 'raster';
            var liste = zellenListe(), mitHotspot = !ordnen && hatHotspot();
            var hs = mitHotspot ? hotspotWahl() : null;
            liste.forEach(function (k, nr) {
                var z = document.createElement('div');
                var key = k.hotspot ? '_hotspot' : schluessel(k);
                var f = format(key);

            tipp.textContent = ev.target.classList.contains('ev') ? ev.target.dataset.text : uhrzeitSek(zeitBei(ev));
            tipp.classList.toggle('seitlich', senk);
            if (senk) { tipp.style.left = (spur.getBoundingClientRect().left - 6) + 'px'; tipp.style.top = ev.clientY + 'px'; }
            else { tipp.style.left = ev.clientX + 'px'; tipp.style.top = (spur.getBoundingClientRect().top - 4) + 'px'; }
            tipp.hidden = false;
        }
        sp.addEventListener('mousemove', function (ev) { if (!zug) { tippZeigen(ev); } });

        /* ================================================================ Alarm: 60 s groß zeigen */
        /** Jede Bedienung beendet die automatische Alarm-Ansicht (sie springt dann nicht zurück). */
        function benutzt() {
            if (auto) { clearTimeout(auto.timer); auto = null; }
        }

        function alarmPruefen() {
            var neu = null;
            daten.kameras.forEach(function (k) {
                if (k.alarm && alarmVorher[k.kamera] === false) { neu = neu || k.kamera; }
                alarmVorher[k.kamera] = !!k.alarm;
            });
            if (!neu || wg || ordnen) { return false; }
            // Ansicht mit Hotspot-Feld: der Alarm erscheint dort, die Übersicht bleibt stehen
            if (modus === 'uebersicht' && hatHotspot() && sichtKameras().some(function (k) { return k.kamera === neu; })) { hotspotSetzen(neu); return false; }
            if (auto) { clearTimeout(auto.timer); }
            var vorher = auto ? auto.vorher : { modus: modus, aktiv: aktiv };
            auto = { kamera: neu, vorher: vorher, timer: setTimeout(function () {
                var v = auto && auto.vorher;
                auto = null;
                if (!v || wg) { return; }
                if (v.modus === 'kamera' && v.aktiv) { kameraOeffnen(v.aktiv); } else { uebersicht(); }
            }, (daten.alarmSprung || 60) * 1000) };
            kameraOeffnen(neu);
            return true;
        }

        /* ================================================================ Daten von Symcon */
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) { return; }
            if (modus === 'uebersicht') { rasterLaden(); hotspotLaden(); } else if (!wg) { liveBildLaden(); }
            if (ansicht.folgen) { ansicht.bis = jetzt(); }
            zlLaden(true);
        });
        window.addEventListener('resize', function () { if (daten) { zlLageSetzen(); zlInhalt(); rasterAnordnen(); } });

        function handleMessage(nachricht) {
            var neu = typeof nachricht === 'string' ? JSON.parse(nachricht) : nachricht;
            if (!neu || !neu.hook) { return; }
            var erst = daten === null;
            var kameraWechsel = !daten || JSON.stringify((daten.kameras || []).map(function (k) { return k.kamera + (k.zugang ? k.zugang.hook + JSON.stringify(k.zugang.ptz || null) : ''); }))
                !== JSON.stringify((neu.kameras || []).map(function (k) { return k.kamera + (k.zugang ? k.zugang.hook + JSON.stringify(k.zugang.ptz || null) : ''); }));
            if (daten && JSON.stringify(daten.layout || null) !== JSON.stringify(neu.layout || null)) { kameraWechsel = true; }
            var vorherUngesehen = erst ? null : ungesehenAlle();
            daten = neu;
            // In Frigate bestätigt (Zähler geändert): Zeitleiste ganz neu laden, damit die Marken folgen
            if (vorherUngesehen !== null && vorherUngesehen !== ungesehenAlle()) {
                Object.keys(zlDaten).forEach(function (k) { if (!zlDaten[k].laedt) { zlDaten[k].von = 1e12; } });
                zlLaden(true);
            }
            document.body.classList.toggle('eigen', !!daten.eigen);
            if (erst) {
                ansicht.spanne = Math.max(300, Math.min(93000, (daten.stunden || 24) * 3600));
                daten.kameras.forEach(function (k) { alarmVorher[k.kamera] = !!k.alarm; });
                zlTakt();
            }
            if (aktiv !== null && !kameraDaten(aktiv)) { wiedergabeStoppen(); liveStoppen(); modus = 'uebersicht'; aktiv = null; }
            if (alarmPruefen()) { return; }
            if (erst || kameraWechsel) { hauptZeichnen(); return; }
            // Sonst nur Kopf und Marken auffrischen (Video und Zeitleiste laufen weiter)
            kopfZeichnen();
            if (modus === 'uebersicht') {
                document.querySelectorAll('.zelle').forEach(function (z) {
                    var k = kameraDaten(z.dataset.kamera);
                    if (!k) { return; }
                    z.classList.toggle('alarm', !!k.alarm);
                    z.classList.toggle('offline', k.online === false);
                    var m = z.querySelector('.marken');
                    if (m) { z.replaceChild(marken(k, z.classList.contains('hotspot')), m); }
                });
            } else {
                document.querySelectorAll('.wahl button').forEach(function (b) {
                    var k = kameraDaten(b.dataset.kamera);
                    if (k) { b.textContent = (k.alarm ? '🚨 ' : '') + k.name; }
                });
            }
        }
    </script>
